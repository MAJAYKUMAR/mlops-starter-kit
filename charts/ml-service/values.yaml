# Default values for ml-service.
# Override these in your own values file or with --set.

replicaCount: 1

image:
  # Replace with your own model-serving image, e.g. your-registry/ml-service:1.0.0
  repository: ml-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Optional environment variables passed to the container.
env: []
# - name: MODEL_NAME
#   value: iris-random-forest
